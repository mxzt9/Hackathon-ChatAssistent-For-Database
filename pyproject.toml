[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = [".test-tmp"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app", "database", "ml", "sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.test-tmp/pytest"
asyncio_mode = "auto"
