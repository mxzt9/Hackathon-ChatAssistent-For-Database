services:
    postgres:
        image: postgres:16-alpine
        restart: unless-stopped
        environment:
            POSTGRES_DB: university
            POSTGRES_USER: university
            POSTGRES_PASSWORD: university
        ports:
            - '127.0.0.1:5432:5432'
        volumes:
            - postgres_data:/var/lib/postgresql/data
        mem_limit: 512m
        cpus: 1.0
        pids_limit: 100
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U university -d university']
            interval: 3s
            timeout: 3s
            retries: 20
volumes:
    postgres_data:
